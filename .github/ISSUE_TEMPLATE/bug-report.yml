name: Bug report
description: Tell us about something that isn't working correctly.
title: "[Bug] "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Tell us what went wrong and what you expected instead.
      placeholder: I tried to..., but...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Steps, screenshots, or anything else that might help.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: Safari on iPhone, Chrome on Mac, etc.
    validations:
      required: false

  - type: input
    id: game
    attributes:
      label: Game or room ID
      description: Optional, if relevant.
    validations:
      required: false
