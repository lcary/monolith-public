name: Bug report
description: Tell us about something that isn't working correctly.
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Monolith.

        Please don't include passwords, authentication tokens, email addresses,
        private account information, or other sensitive data.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the problem.
      placeholder: I tried to deploy a system, but...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: If possible, tell us how to make the problem happen again.
      placeholder: |
        1. Start a game
        2. Play ...
        3. Click ...
        4. See ...
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop / laptop
        - Phone
        - Tablet
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      description: "Examples: Chrome 140 on macOS, Safari on iPhone, Firefox on Windows."
      placeholder: Safari 26 on macOS
    validations:
      required: false

  - type: input
    id: page
    attributes:
      label: Page or part of the game
      description: Where did the problem occur?
      placeholder: Game board, leaderboard, login, tutorial, etc.
    validations:
      required: false

  - type: input
    id: game
    attributes:
      label: Game or room ID
      description: Optional. Include this only if you know it and are comfortable sharing it publicly.
      placeholder: Optional
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Drag screenshots or short recordings here if they help explain the issue.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Any other context that might help.
    validations:
      required: false
