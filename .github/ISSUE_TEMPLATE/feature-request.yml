name: Feature request
description: Suggest an improvement or new idea for Monolith.
title: "[Feature] "
labels:
  - feature

body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the idea or improvement.
      placeholder: It would be useful if...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would this help?
      description: Optional context about the problem this would solve or the experience it would improve.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Examples, screenshots, or other context.
    validations:
      required: false
